stages:
  - deploy

pages:
  image: instrumentisto/flutter:latest
  stage: deploy

  before_script:
    - flutter pub get

  script:
    - cd my_assignment
    - flutter build web
    - mkdir public
    - cp -r build/web/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "assignment2"
  environment: production
